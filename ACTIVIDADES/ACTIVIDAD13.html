<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let frutas=["manzana", "banana", "cereza", "naranja", "pera", "kiwi", "mango", "piña"];
        let precio=[10.2, 4.3, 5.6, 7.8, 3.4, 8.9, 6.7, 9.1];
        let cantidad=[50, 100, 75, 80, 60, 40, 30, 20];

        alert("Fruteria")

        for (let i=0; i<frutas.length;i++){
            alert(frutas[i] + "," + precio[i] + "€/kg" );
        }

        let total = 0;
        let continuar = "si";

        while (continuar === "si"){
            let eleccion = prompt("que fruta quieres??");
            let existe="no";

            for(let i = 0; i<frutas.length;i++){
                if(eleccion==frutas[i]){
                    existe = "si";
                    let eleccion_kg = parseFloat(prompt("¿Cuantos kilos?"));
                    total+=parseFloat(precio[i]*eleccion_kg);
                }
            }
            if(existe === "no"){
                alert("No tengo de eso");
            }
            continuar=prompt("quieres comprar otra fruta??");
        }
        alert("Fin. Total a pagar: " + total + "€");
    </script>
</body>
</html>
